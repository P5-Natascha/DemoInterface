<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eceff3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Natascha – P5-Fahrroboter</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<script src="texte.js"></script>
</head>
<body>
<!-- Alle Texte stehen in texte.js (Block "TEXTE UND EINSTELLUNGEN"). Hier nur die Struktur. -->
<template id="icon-github"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></template>

<header><div class="wrap">
  <b data-t="kopfzeile.name"></b>
  <nav>
    <a href="#kameras" data-t="kopfzeile.menue.kameras"></a>
    <a href="#telemetrie" data-t="kopfzeile.menue.telemetrie"></a>
    <a href="#technik" data-t="kopfzeile.menue.technik"></a>
    <a href="#projekt" data-t="kopfzeile.menue.projekt"></a>
  </nav>
  <a class="gh" data-gh href="#" target="_blank" rel="noopener"><span data-t="kopfzeile.githubKnopf"></span></a>
</div></header>

<main>
<div class="wrap hero">
  <div>
    <h1 data-t="start.titel"></h1>
    <p class="lede" data-t="start.einleitung"></p>
    <div class="pills">
      <span class="pill" id="pBack"><i class="dot"></i><span data-t="start.status.server"></span></span>
      <span class="pill" id="pCar"><i class="dot"></i><span data-t="start.status.auto"></span></span>
      <span class="pill" id="pMode"><i class="dot"></i><span data-t="start.status.fahrmodus"></span></span>
      <span class="pill"><span id="pps">0</span><span data-t="start.status.pakete"></span></span>
    </div>
  </div>

  <div class="cockpit" id="cockpit">
    <h2 data-t="steuerung.titel"></h2>
    <p id="ctrlMsg" data-t="steuerung.meldungen.bereit"></p>
    <div class="padwrap">
      <div id="pad" role="application" data-t-aria="steuerung.joystickBeschreibung"><div id="knob"></div></div>
      <div class="raw">
        <span><span data-t="steuerung.achseX"></span><b id="rx">2048</b></span>
        <span><span data-t="steuerung.achseY"></span><b id="ry">2048</b></span>
      </div>
    </div>
    <p class="hint" data-t="steuerung.rohwerte"></p>
    <p class="hint tip" data-t="steuerung.tippHandy"></p>
    <button class="fsbtn" id="fsBtn" type="button" data-t-aria="steuerung.vollbild.an">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="p-in" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><path class="p-out" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
      <span class="tx" id="fsTx" data-t="steuerung.vollbild.an"></span>
    </button>
    <p class="fsnote" id="fsNote" hidden></p>
  </div>
</div>

<section id="kameras"><div class="wrap">
  <h2 class="t" data-t="kameras.titel"></h2>
  <p class="sub" data-t="kameras.einleitung"></p>
  <div class="cams">
    <figure class="cam">
      <img id="img-front" data-t-alt="kameras.bildVorne" hidden>
      <p id="msg-front" data-t="kameras.meldungen.verbinde"></p>
      <figcaption data-t="kameras.vorne"></figcaption>
    </figure>
    <figure class="cam">
      <img id="img-back" data-t-alt="kameras.bildHinten" hidden>
      <p id="msg-back" data-t="kameras.meldungen.verbinde"></p>
      <figcaption data-t="kameras.hinten"></figcaption>
    </figure>
  </div>
</div></section>

<section id="telemetrie"><div class="wrap">
  <h2 class="t" data-t="telemetrie.titel"></h2>
  <p class="sub" data-t="telemetrie.einleitung"></p>
  <div class="tele">
    <div class="tile">
      <h3 data-t="telemetrie.akku"></h3>
      <div class="val"><span id="batt" data-t="telemetrie.leer"></span><small data-t="telemetrie.einheitSpannung"></small></div>
      <div class="bar"><i id="battBar"></i></div>
    </div>
    <div class="tile">
      <h3 data-t="telemetrie.strom"></h3>
      <div class="val"><span id="ampr" data-t="telemetrie.leer"></span><small data-t="telemetrie.einheitStrom"></small></div>
      <div class="bar"><i id="amprBar" style="background:var(--blue)"></i></div>
    </div>
    <div class="tile">
      <h3 data-t="telemetrie.lenkung"></h3>
      <div class="val"><span id="lenk" data-t="telemetrie.leer"></span><small data-t="telemetrie.einheitSpannung"></small></div>
      <div class="bar mid"><i id="lenkBar" style="background:var(--blue)"></i></div>
    </div>
    <div class="tile span2">
      <h3 data-t="telemetrie.abstand"></h3>
      <div class="dist">
        <div><div class="val"><span id="absv" data-t="telemetrie.leer"></span><small data-t="telemetrie.einheitAbstandVorne"></small></div><div class="bar"><i id="absvBar"></i></div></div>
        <div><div class="val"><span id="absh" data-t="telemetrie.leer"></span><small data-t="telemetrie.einheitAbstandHinten"></small></div><div class="bar"><i id="abshBar"></i></div></div>
      </div>
    </div>
  </div>
</div></section>

<section id="technik"><div class="wrap">
  <h2 class="t" data-t="technik.titel"></h2>
  <p class="sub" data-t="technik.einleitung"></p>
  <div class="flow" id="flow"></div>
  <div class="viz">
    <div class="viz-t"><b data-t="technik.live.titel"></b><span class="viz-c"><b id="lvPkts">0</b> <span data-t="technik.live.pakete"></span></span></div>
    <div class="pipe" id="pipe">
      <div class="stage"><b data-t="technik.live.browser"></b><span class="v" id="lvXY">X 2048 · Y 2048</span></div>
      <div class="link"><span class="proto" data-t="technik.live.ws"></span></div>
      <div class="stage"><b data-t="technik.live.server"></b><span class="v">WebSocket</span></div>
      <div class="link"><span class="proto" data-t="technik.live.udp"></span></div>
      <div class="stage"><b data-t="technik.live.captain"></b><span class="v">inputHandler</span></div>
      <div class="link"><span class="proto" data-t="technik.live.intern"></span></div>
      <div class="stage out"><b data-t="technik.live.antrieb"></b><span class="v" id="lvOut">–</span></div>
    </div>
    <p class="viz-tip" data-t="technik.live.tip"></p>
  </div>
</div></section>

<section id="projekt"><div class="wrap">
  <h2 class="t" data-t="projekt.titel"></h2>
  <p class="sub" data-t="projekt.einleitung"></p>
  <div class="specs" id="specs"></div>
</div></section>
</main>

<footer><div class="wrap">
  <span data-t="fusszeile.sicherheit"></span>
  <span data-t="fusszeile.datenschutz" style="margin-left:10px"></span>
  <div style="margin-top:16px"><a class="gh" data-gh href="#" target="_blank" rel="noopener"><span data-t="fusszeile.githubKnopf"></span></a></div>
</div></footer>

<script src="app.js"></script>
</body>
</html>
